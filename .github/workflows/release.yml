name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          if [ -z "$version" ]; then
            echo "::error::gradle.properties has no version line."
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT)
              echo "::error::main releases only a release version, not $version: set the version in gradle.properties without -SNAPSHOT."
              exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::The tag $TAG already exists: every release needs a new version in gradle.properties."
            exit 1
          fi

      - name: Check the secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "::error::Set the repository secrets MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD (the Central Portal user token)."
            exit 1
          fi
          if [ -z "$SIGNING_IN_MEMORY_KEY" ]; then
            echo "::error::Set the repository secret SIGNING_KEY: Maven Central takes only signed releases."
            exit 1
          fi

  natives:
    name: natives
    needs: version
    uses: ./.github/workflows/natives.yml

  # Maven Central once, with the native jars that every runner built and tested, then the tag and the GitHub release.
  release:
    name: release
    needs: [version, natives]
    # The runner of the linux-x86_64 natives, whose native build cache it restores.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The headers for the generated classes and the linux-x86_64 libraries, from the cache that the natives job saved.
      - name: Cache the native build
        uses: actions/cache@v5
        with:
          path: |
            cppbuild/linux-x86_64/include
            cppbuild/linux-x86_64/lib
            cppbuild/linux-x86_64/bin
            cppbuild/linux-x86_64/.cppbuild
          key: cppbuild-linux-x86_64-${{ hashFiles('cppbuild.sh') }}

      - name: Build CTranslate2
        run: bash ./cppbuild.sh linux-x86_64

      - name: Download the native jars
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native-jars
          merge-multiple: true

      - name: Check the native jars
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for platform in windows-x86_64 linux-x86_64 linux-arm64 macosx-arm64; do
            if [ ! -f "native-jars/ctranslate2-java-$VERSION-$platform.jar" ]; then
              echo "::error::The release lacks ctranslate2-java-$VERSION-$platform.jar."
              exit 1
            fi
          done

      - name: Publish and release
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # An unset secret arrives as an empty variable.
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyId" ]; then
            unset ORG_GRADLE_PROJECT_signingInMemoryKeyId
          fi
          ./gradlew publishAndReleaseToMavenCentral -PjavacppPlatform=linux-x86_64 -PnativeJarsDirectory="$PWD/native-jars"

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The notes list the commits since the previous release tag, without the version changes and the release merges.
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            git log --no-merges --format='* %s' "${previous:+$previous..}$GITHUB_SHA" | grep -v '^\* Bump version to ' || true

            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            fi
          } > release-notes.md

          gh release create "$TAG" native-jars/ctranslate2-java-"$VERSION"-*.jar --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file release-notes.md
